services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: medical_diagnosis
      POSTGRES_USER: diagnosis
      POSTGRES_PASSWORD: diagnosis
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diagnosis -d medical_diagnosis"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
